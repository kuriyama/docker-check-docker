name: Build Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

env:
  IMAGE: kuriyama/check-docker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build candidate (amd64)
        run: |
          docker buildx build \
              --pull \
              --no-cache \
              --platform linux/amd64 \
              --load \
              --tag candidate:latest \
              .

      - name: Compare installed packages
        id: compare
        shell: sh
        run: |
          set -eu

          docker run --rm \
              --entrypoint cat \
              candidate:latest \
              /usr/local/share/image-packages.txt \
              > candidate-packages.txt

          if docker pull "$IMAGE:latest" \
              && docker run --rm \
                  --entrypoint cat \
                  "$IMAGE:latest" \
                  /usr/local/share/image-packages.txt \
                  > published-packages.txt 2>/dev/null; then

              if cmp -s published-packages.txt candidate-packages.txt; then
                  echo "changed=false" >> "$GITHUB_OUTPUT"
                  echo "No package changes"
              else
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "Package changes detected"
                  diff -u published-packages.txt candidate-packages.txt || true
              fi
          else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "No published image, or no package list in published image"
          fi

      - name: Build and push (amd64/arm64)
        if: steps.compare.outputs.changed == 'true'
        run: |
          IMAGE_TAG="$(TZ=Asia/Tokyo date +%Y-%m-%d)-${GITHUB_SHA:0:7}"

          docker buildx build \
              --pull \
              --no-cache \
              --platform linux/amd64,linux/arm64 \
              --tag "$IMAGE:latest" \
              --tag "$IMAGE:${IMAGE_TAG}" \
              --push \
              .
