name: Build Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

env:
  IMAGE: kuriyama/check-docker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build candidate
        run: |
          docker build \
              --pull \
              --no-cache \
              --tag candidate:latest \
              .

      - name: Compare installed packages
        id: compare
        shell: sh
        run: |
          set -eu

          docker run --rm \
              --entrypoint cat \
              candidate:latest \
              /usr/local/share/image-packages.txt \
              > candidate-packages.txt

          if docker pull "$IMAGE:latest"; then
              docker run --rm \
                  --entrypoint cat \
                  "$IMAGE:latest" \
                  /usr/local/share/image-packages.txt \
                  > published-packages.txt

              if cmp -s published-packages.txt candidate-packages.txt; then
                  echo "changed=false" >> "$GITHUB_OUTPUT"
                  echo "No package changes"
              else
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  echo "Package changes detected"
                  diff -u published-packages.txt candidate-packages.txt || true
              fi
          else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "No published image found"
          fi

      - name: Push image
        if: steps.compare.outputs.changed == 'true'
        shell: sh
        run: |
          set -eu

          docker tag candidate:latest "$IMAGE:latest"
          docker tag candidate:latest "$IMAGE:${GITHUB_SHA}"

          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
